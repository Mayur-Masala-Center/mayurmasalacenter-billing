name: Android CI/CD

on:
  # Lint + unit tests run on every push and PR (fast, free, no secrets needed)
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # APK / AAB builds are MANUAL ONLY — trigger via "Run workflow" on GitHub Actions
  workflow_dispatch:
    inputs:
      build_type:
        description: 'What to build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  # ── Job 1: Lint + Unit Tests (runs on push, PR, and manual) ────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lint
        continue-on-error: false

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: apk/app/build/reports/lint-results-debug.html

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: apk/app/build/reports/tests/testDebugUnitTest/

  # ── Job 2: Debug APK — MANUAL ONLY ────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test
    # Only run when triggered manually with build_type=debug (or no release secrets set)
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '')
    defaults:
      run:
        working-directory: apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: apk/app/build/outputs/logs/

  # ── Job 3: Signed Release AAB — MANUAL ONLY ───────────────────────
  build-release:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release'
    defaults:
      run:
        working-directory: apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore

      - name: Build signed release AAB
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: apk/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Clean up keystore
        if: always()
        run: rm -f /tmp/release.keystore
